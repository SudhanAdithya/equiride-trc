<ion-content fullscreen class="login-content" scroll-y="false">
  <div class="login-wrapper">
    <!-- Background image with overlay -->
    <div class="login-hero">
      <div class="hero-overlay"></div>
    </div>

    <!-- Content -->
    <div class="login-content-inner">
      <!-- Logo Area -->
      <div class="logo-section animate-slide-up">
        <div class="logo-badge">
          <ion-icon name="ribbon-outline"></ion-icon>
        </div>
        <h1 class="club-name">TRC</h1>
        <p class="club-full-name">Tirupur Riding Club</p>
      </div>

      <!-- Tagline -->
      <div class="tagline-section animate-slide-up" style="animation-delay: 0.2s">
        <p class="tagline">Where Passion Meets the Saddle</p>
        <div class="divider">
          <span class="divider-line"></span>
          <ion-icon name="heart" class="divider-icon"></ion-icon>
          <span class="divider-line"></span>
        </div>
      </div>

      <!-- CTA Section -->
      <div class="cta-section animate-slide-up" style="animation-delay: 0.4s">
        <button class="google-btn" (click)="doGoogleLogin()">
          <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span>Continue with Google</span>
          <ion-icon name="arrow-forward-outline" class="arrow-icon"></ion-icon>
        </button>

        <p class="terms-text">
          By continuing, you agree to our Terms of Service
        </p>
      </div>

      <!-- Bottom decoration -->
      <div class="bottom-decoration animate-fade-in" style="animation-delay: 0.6s">
        <div class="dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </div>
</ion-content>
